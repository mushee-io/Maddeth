name: Build and Test

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "script/**"
      - "scripts/**"
      - "src/**"
      - "config/**"
      - "app/**"
      - "docs/**"
      - "index.html"
      - "vercel.json"
      - "foundry.toml"
      - ".github/workflows/contracts.yml"
      - ".github/workflows/deploy-kub-testnet.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "script/**"
      - "scripts/**"
      - "src/**"
      - "config/**"
      - "app/**"
      - "docs/**"
      - "index.html"
      - "vercel.json"
      - "foundry.toml"
      - ".github/workflows/contracts.yml"
      - ".github/workflows/deploy-kub-testnet.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check multipage frontend and deployment integrity
        run: |
          node --input-type=module --check < src/protocol-config.js
          node --input-type=module --check < src/protocol.js
          node --input-type=module --check < src/site.js
          node --input-type=module --check < src/app-pages.js
          node --check scripts/apply-deployment.mjs
          node --check scripts/check-frontend.mjs
          node scripts/check-frontend.mjs
          git diff --check

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge build
        run: forge build

      - name: Forge test
        run: forge test -vvv
