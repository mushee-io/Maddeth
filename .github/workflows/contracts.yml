name: Build and Test

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "script/**"
      - "scripts/**"
      - "src/**"
      - "config/**"
      - "app/**"
      - "docs/**"
      - "index.html"
      - "vercel.json"
      - "foundry.toml"
      - ".github/workflows/contracts.yml"
      - ".github/workflows/deploy-kub-testnet.yml"
      - ".github/workflows/deploy-liquidation-lab.yml"
      - ".github/workflows/resume-kub-testnet.yml"
      - ".github/workflows/inspect-kub-testnet.yml"
      - ".github/workflows/final-readiness.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "script/**"
      - "scripts/**"
      - "src/**"
      - "config/**"
      - "app/**"
      - "docs/**"
      - "index.html"
      - "vercel.json"
      - "foundry.toml"
      - ".github/workflows/contracts.yml"
      - ".github/workflows/deploy-kub-testnet.yml"
      - ".github/workflows/deploy-liquidation-lab.yml"
      - ".github/workflows/resume-kub-testnet.yml"
      - ".github/workflows/inspect-kub-testnet.yml"
      - ".github/workflows/final-readiness.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check multipage frontend and deployment integrity
        run: |
          set -euo pipefail
          node --input-type=module --check < src/protocol-config.js
          node --input-type=module --check < src/protocol.js
          node --input-type=module --check < src/site.js
          node --input-type=module --check < src/app-pages.js
          node --input-type=module --check < src/liquidations.js
          node --input-type=module --check < src/liquidation-lab.js
          node --input-type=module --check < src/liquidation-lab-inline.js
          node --input-type=module --check < src/risk-admin.js
          node --input-type=module --check < src/readiness.js
          node --check scripts/apply-deployment.mjs
          node --check scripts/apply-liquidation-lab-deployment.mjs
          node --check scripts/check-frontend.mjs
          node --check scripts/check-foundry-fs-permissions.mjs
          node --check scripts/export-deployment-env.mjs
          node --check scripts/first-unresolved-deployment-nonce.mjs
          node --check scripts/validate-kub-deployment.mjs
          node --check scripts/check-release-readiness.mjs
          node --check scripts/kub-health-check.mjs
          node scripts/check-foundry-fs-permissions.mjs
          node scripts/check-frontend.mjs
          node scripts/check-release-readiness.mjs
          git diff --check

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge build
        run: forge build

      - name: Forge test
        shell: bash
        run: |
          set -euo pipefail
          forge test -vvv 2>&1 | tee forge-test.log

      - name: Upload Foundry test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-test-log-${{ github.run_id }}
          path: forge-test.log
          if-no-files-found: warn
          retention-days: 7
