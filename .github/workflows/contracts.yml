name: Contracts

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "foundry.toml"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "foundry.toml"
      - ".github/workflows/contracts.yml"

jobs:
  forge-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge build
        run: forge build

      - name: Forge test
        run: forge test -vvv
