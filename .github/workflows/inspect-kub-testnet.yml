name: Inspect KUB Testnet Deployment

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect chain state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUB_RPC_URL: "https://rpc-testnet.bitkubchain.io"
      EXPECTED_CHAIN_ID: "25925"
      DEPLOYER: "0x762Af840189565eae4BE107c74DDe046f811236D"
      FIRST_TX: "0x0451ac96de187eb9c0353a5482b8416837cd138f9e7db6941a83448a7ff6658e"
      LAST_TX: "0xfaec9b5169e072f4b72ef7971e1951a4a0bf87ad1ed92726d8f1780685e24a23"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Inspect KUB testnet state
        shell: bash
        run: |
          set -euo pipefail

          chain_id="$(cast chain-id --rpc-url "$KUB_RPC_URL")"
          if [[ "$chain_id" != "$EXPECTED_CHAIN_ID" ]]; then
            echo "::error::Unexpected chain id: $chain_id (expected $EXPECTED_CHAIN_ID)"
            exit 1
          fi

          block_number="$(cast block-number --rpc-url "$KUB_RPC_URL")"
          balance="$(cast balance "$DEPLOYER" --rpc-url "$KUB_RPC_URL")"
          gas_hex="$(cast rpc --rpc-url "$KUB_RPC_URL" eth_gasPrice | tr -d '\"')"
          latest_hex="$(cast rpc --rpc-url "$KUB_RPC_URL" eth_getTransactionCount "$DEPLOYER" latest | tr -d '\"')"
          pending_hex="$(cast rpc --rpc-url "$KUB_RPC_URL" eth_getTransactionCount "$DEPLOYER" pending | tr -d '\"')"
          latest="$((16#${latest_hex#0x}))"
          pending="$((16#${pending_hex#0x}))"
          queued="$((pending-latest))"

          echo "KUB Testnet block: $block_number"
          echo "Deployer balance: $balance wei"
          echo "RPC gas price: $gas_hex"
          echo "Latest nonce: $latest"
          echo "Pending nonce: $pending"
          echo "Queued nonce count: $queued"

          {
            echo "## KUB Testnet deployment inspection"
            echo
            echo "- Chain ID: $chain_id"
            echo "- Block: $block_number"
            echo "- Deployer: $DEPLOYER"
            echo "- Balance: $balance wei"
            echo "- RPC gas price: $gas_hex"
            echo "- Latest nonce: $latest"
            echo "- Pending nonce: $pending"
            echo "- Queued nonce count: $queued"
            echo
            echo "### Completed deployment batch"
          } >> "$GITHUB_STEP_SUMMARY"

          for h in "$FIRST_TX" "$LAST_TX"; do
            echo "=== transaction $h ==="
            tx="$(cast rpc --rpc-url "$KUB_RPC_URL" eth_getTransactionByHash "$h" || true)"
            receipt="$(cast rpc --rpc-url "$KUB_RPC_URL" eth_getTransactionReceipt "$h" || true)"
            echo "tx: $tx"
            echo "receipt: $receipt"
            {
              echo
              echo "#### $h"
              echo '```json'
              echo "$tx"
              echo '```'
              echo '```json'
              echo "$receipt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo
            echo "### Completed deployment addresses"
            echo
            echo '| Contract | Address | Code |'
            echo '|---|---|---:|'
          } >> "$GITHUB_STEP_SUMMARY"

          while read -r contract_name addr; do
            code="$(cast code "$addr" --rpc-url "$KUB_RPC_URL")"
            if [[ "$code" == "0x" || -z "$code" ]]; then
              status="EMPTY"
              bytes=0
            else
              status="HAS_CODE"
              bytes="$(( (${#code} - 2) / 2 ))"
            fi
            echo "$contract_name $addr $status bytes=$bytes"
            echo "| $contract_name | $addr | $status ($bytes bytes) |" >> "$GITHUB_STEP_SUMMARY"
          done <<'EOF'
          WrappedTKUB 0x9f99A8573F7A330eA01E04117e29d98e0164f88E
          mUSDC 0x2d6f6A9b93dE56E4169fbc7C5a2F1dE0B55bC1F8
          mUSDT 0x5609661078c717b996Ab0185d5a555925Da27bE5
          Oracle 0x4D468eb9b0b7AD964a87Cb79E5D329D9a22a9D36
          InterestRateModel 0x127f127281f8Be23D9789a44fFFC7a2A980BE6d6
          MaddethPool 0xe381d4d97fA0206D447d1E965F1c1dB96cC5fDc6
          MaddethLens 0x55F4a27C67916A47E8421576c07cB2Ffe7B7022d
          RwaVaultFactory 0x76Dd7E8A3f77f7cD2C3d84C025cBBD01670991A4
          SampleRwaVault 0x0958Cc85232D8393B92D1463D2DFeB4FEFb8B801
          EOF

          echo >> "$GITHUB_STEP_SUMMARY"
          if (( queued > 0 )); then
            echo "Pending transactions are present. Do not start another deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No queued nonce gap was reported by the RPC." >> "$GITHUB_STEP_SUMMARY"
          fi
