name: Final Testnet Readiness

on:
  workflow_dispatch:
    inputs:
      check_production_ui:
        description: "Also verify the deployed maddeth.vercel.app routes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: final-testnet-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Repository readiness guards
        run: |
          set -euo pipefail
          node --check scripts/check-frontend.mjs
          node --check scripts/check-release-readiness.mjs
          node --check scripts/kub-health-check.mjs
          node --input-type=module --check < src/readiness.js
          node scripts/check-frontend.mjs
          node scripts/check-release-readiness.mjs
          git diff --check

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Full contract build
        run: |
          set -euo pipefail
          forge build

      - name: Full unit fuzz invariant and stress suite
        run: |
          set -euo pipefail
          forge test -vvv

      - name: Canonical KUB health check
        run: |
          set -euo pipefail
          node scripts/kub-health-check.mjs | tee kub-health-report.json

      - name: Upload canonical health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kub-health-${{ github.run_id }}
          path: kub-health-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify production frontend routes
        if: ${{ inputs.check_production_ui }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 https://maddeth.vercel.app/app/ > /tmp/dashboard.html
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 https://maddeth.vercel.app/app/liquidations/ > /tmp/liquidations.html
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 https://maddeth.vercel.app/app/protocol/ > /tmp/protocol.html
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 https://maddeth.vercel.app/app/readiness/ > /tmp/readiness.html
          grep -Fq "Liquidation Lab" /tmp/liquidations.html
          grep -Fq "Risk & resilience console" /tmp/protocol.html
          grep -Fq "FINAL TESTNET READINESS" /tmp/readiness.html
          grep -Fq "MADDETH" /tmp/dashboard.html
          echo "Production UI route smoke PASS"
