name: Recover KUB Testnet Deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RECOVER-KUB-TESTNET to validate and adopt the already-broadcast deployment"
        required: true
        type: string

concurrency:
  group: maddeth-kub-testnet-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: kub-testnet
    env:
      KUB_TESTNET_RPC_URL: https://rpc-testnet.bitkubchain.io
      PRIVATE_KEY: ${{ secrets.KUB_TESTNET_PRIVATE_KEY }}
      SOURCE_RUN_ID: "34813143090"
      SOURCE_ARTIFACT: kub-testnet-deployment-34813143090
    steps:
      - name: Require explicit recovery confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "RECOVER-KUB-TESTNET" ]; then
            echo "Recovery confirmation did not match."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Require KUB Testnet signer
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_KEY" ]; then
            echo "Missing KUB_TESTNET_PRIVATE_KEY environment secret."
            exit 1
          fi
          CHAIN_ID=$(cast chain-id --rpc-url "$KUB_TESTNET_RPC_URL")
          if [ "$CHAIN_ID" != "25925" ]; then
            echo "Refusing recovery: RPC is not KUB Testnet chain 25925."
            exit 1
          fi
          CURRENT_DEPLOYER=$(cast wallet address --private-key "$PRIVATE_KEY")
          BALANCE=$(cast balance "$CURRENT_DEPLOYER" --rpc-url "$KUB_TESTNET_RPC_URL")
          echo "KUB Testnet chain id: $CHAIN_ID"
          echo "Recovery signer: $CURRENT_DEPLOYER"
          echo "Native balance (wei): $BALANCE"

      - name: Resolve KUB legacy gas price
        shell: bash
        run: |
          set -euo pipefail
          GAS_PRICE_WEI=$(cast gas-price --rpc-url "$KUB_TESTNET_RPC_URL")
          if ! [[ "$GAS_PRICE_WEI" =~ ^[0-9]+$ ]] || [ "$GAS_PRICE_WEI" -le 0 ]; then
            echo "Invalid legacy gas price returned by KUB Testnet RPC: $GAS_PRICE_WEI"
            exit 1
          fi
          echo "KUB_LEGACY_GAS_PRICE=$GAS_PRICE_WEI" >> "$GITHUB_ENV"
          echo "KUB legacy gas price: $GAS_PRICE_WEI wei"

      - name: Download successful broadcast artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: recovered-kub-deployment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Restore deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s recovered-kub-deployment/deployment-kub-testnet.json
          cp recovered-kub-deployment/deployment-kub-testnet.json deployment-kub-testnet.json
          node scripts/export-deployment-env.mjs deployment-kub-testnet.json "$GITHUB_ENV"

      - name: Verify recovery signer owns the deployment
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_DEPLOYER=$(cast wallet address --private-key "$PRIVATE_KEY")
          if [ "${CURRENT_DEPLOYER,,}" != "${DEPLOYMENT_DEPLOYER,,}" ]; then
            echo "Recovery signer does not match the deployer recorded in the preserved manifest."
            exit 1
          fi
          echo "Recovery signer matches preserved deployment owner."

      - name: Verify deployed bytecode exists
        shell: bash
        run: |
          set -euo pipefail
          for ADDRESS in "$MADDETH_POOL" "$MADDETH_LENS" "$ORACLE" "$INTEREST_RATE_MODEL" "$RWA_FACTORY" "$SAMPLE_RWA" "$WRAPPED_KUB" "$TEST_USDC" "$TEST_USDT"; do
            if ! [[ "$ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              echo "Invalid deployment address: $ADDRESS"
              exit 1
            fi
            CODE=$(cast code "$ADDRESS" --rpc-url "$KUB_TESTNET_RPC_URL")
            if [ "$CODE" = "0x" ]; then
              echo "No bytecode at $ADDRESS"
              exit 1
            fi
          done
          echo "All preserved KUB Testnet contracts have bytecode."

      - name: Build and test recovery source
        run: |
          set -euo pipefail
          node --check scripts/export-deployment-env.mjs
          node --check scripts/apply-deployment.mjs
          node scripts/check-frontend.mjs
          git diff --check
          forge clean
          forge build
          forge test -vvv

      - name: End-to-end KUB Testnet lending smoke test
        run: |
          set -euo pipefail
          forge script script/SmokeKubTestnet.s.sol:SmokeKubTestnet \
            --rpc-url "$KUB_TESTNET_RPC_URL" \
            --broadcast \
            --legacy \
            --gas-price "$KUB_LEGACY_GAS_PRICE" \
            -vvvv

      - name: Apply recovered canonical deployment
        run: |
          set -euo pipefail
          node scripts/apply-deployment.mjs deployment-kub-testnet.json
          node --input-type=module --check < src/protocol-config.js
          node scripts/check-frontend.mjs
          git diff --check

      - name: Commit recovered KUB Testnet registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/protocol-config.js config/kub-testnet.json
          if git diff --cached --quiet; then
            echo "Recovered deployment already matches the canonical registry."
          else
            git commit -m "Recover validated Maddeth KUB Testnet deployment"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: kub-testnet-recovery-${{ github.run_id }}
          path: |
            deployment-kub-testnet.json
            recovered-kub-deployment/deployment-kub-testnet.json
            recovered-kub-deployment/broadcast/DeployKubTestnet.s.sol/25925/run-latest.json
            broadcast/SmokeKubTestnet.s.sol/25925/run-latest.json
            broadcast/SmokeKubTestnet.s.sol/25925/run-*.json
          if-no-files-found: warn
          retention-days: 30
